# The website's own checks and the package smoke test the managed CI does not
# run (not managed by the family template). pnpm installs, Bun runs the scripts.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - name: Verify package exports, contents and the classic script
        run: bun run build && bun run test:package
      - run: bun run site:check
      - run: bun run site:format:check
      - run: bun run site:test
      - run: bun run site:build
      - run: bun run site:check:content
      - run: bun run site:check:release
      # Chromium only, without --with-deps: the runner already has its libraries.
      - run: pnpm exec playwright install chromium
        timeout-minutes: 5
      - run: bun run site:test:browser
