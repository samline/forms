name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run test:package
      - run: npm pack --dry-run
      - run: bun audit --production

  documentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - name: Install documentation dependencies
        shell: bash
        run: |
          set +e
          corepack npm ci 2>&1 | tee /tmp/npm-ci.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            node -e 'const fs = require("node:fs"); const output = fs.readFileSync("/tmp/npm-ci.log", "utf8").slice(-4000).replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A"); console.log(`::error title=npm ci failed::${output}`)'
            exit "$status"
          fi
      - run: corepack npm run check
      - run: corepack npm run build
      - run: corepack npm audit --audit-level=high
