name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run test:package
      - run: npm pack --dry-run
      - run: bun audit --production

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run site:check
      - run: bun run site:format:check
      - run: bun run site:test
      - run: bun run site:build
      - run: bun run site:check:content
      - run: bun run site:check:release
      - run: npx playwright install --with-deps chromium
      - run: bun run site:test:browser
